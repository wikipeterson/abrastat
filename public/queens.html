<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Queens — Puzzle Week</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #E8FAF8;
  --text: #0D4F49;
  --muted: #1A8C80;
  --accent: #2EC4B6;
  --accent-light: #D6F5F2;
  --border: #7FD9D3;
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  padding: 10px 14px;
  gap: 7px;
}

.title-row {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.game-title { font-size: 18px; font-weight: 700; }
.diff-group { display: flex; gap: 4px; }
.diff-btn {
  font-size: 11px; font-weight: 600; padding: 4px 11px;
  border-radius: 20px; border: 1.5px solid var(--border);
  background: white; color: var(--muted); cursor: pointer; transition: all 0.14s;
}
.diff-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

.status-bar {
  flex-shrink: 0; background: white; border: 1px solid var(--border);
  border-radius: 14px; padding: 6px 14px; font-size: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px;
}
#status-msg { font-weight: 600; }
#status-msg.conflict { color: #B22222; }
#status-msg.solved   { color: #1A7A4A; }
#status-count { color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }

.board-wrap {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
#board {
  display: grid;
  width: min(calc(100vw - 28px), calc(100dvh - 198px));
  aspect-ratio: 1;
  border-radius: 10px; overflow: hidden;
  user-select: none; touch-action: none; cursor: pointer;
}
.cell { position: relative; transition: filter 0.08s; }
.cell:active { filter: brightness(0.85); }

/* Marks are absolutely positioned so they never resize cells */
.mark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(10px, 3.4vw, 22px); pointer-events: none; line-height: 1;
}
.mark-x        { color: rgba(0,0,0,0.28); font-weight: 700; font-size: clamp(9px, 2.8vw, 18px); }
.mark-queen    { color: rgba(0,0,0,0.70); text-shadow: 0 1px 3px rgba(0,0,0,0.18); }
.mark-conflict { color: #B22222; text-shadow: 0 0 6px rgba(178,34,34,0.35); }
.mark-solved   { color: #1A7A4A; text-shadow: 0 0 8px rgba(46,196,182,0.55); animation: pop 0.28s ease; }
@keyframes pop { 0%{transform:scale(0.25)} 65%{transform:scale(1.18)} 100%{transform:scale(1)} }

.btn-row { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  flex: 1; font-size: 13px; font-weight: 600; padding: 9px 0; border-radius: 12px;
  border: 1.5px solid var(--border); background: white; color: var(--text);
  cursor: pointer; transition: background 0.14s;
}
.btn:hover { background: var(--accent-light); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { filter: brightness(1.06); }

.legend {
  flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 3px 10px;
  max-height: 44px; overflow: hidden; font-size: 11px; color: var(--muted); padding: 0 2px;
}
.legend-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.18); flex-shrink: 0; }

#overlay {
  display: none; position: fixed; inset: 0; background: rgba(232,250,248,0.94); z-index: 50;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px;
}
#overlay.show { display: flex; }
.ov-icon  { font-size: 52px; animation: bounce 0.45s ease; }
@keyframes bounce { 0%{transform:scale(0)} 55%{transform:scale(1.22)} 100%{transform:scale(1)} }
.ov-title { font-size: 26px; font-weight: 800; }
.ov-sub   { color: var(--muted); font-size: 14px; }
.ov-moves { font-weight: 700; color: var(--accent); font-size: 15px; }
</style>
</head>
<body>
<div id="app">
  <div class="title-row">
    <span class="game-title">👑 Queens</span>
    <div class="diff-group">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn"        data-diff="medium">Medium</button>
      <button class="diff-btn"        data-diff="hard">Hard</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-msg">Tap a cell to begin</span>
    <span id="status-count"></span>
  </div>

  <div class="board-wrap"><div id="board"></div></div>

  <div class="btn-row">
    <button class="btn"         id="btn-solution">Show Solution</button>
    <button class="btn primary" id="btn-new">New Puzzle</button>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div id="overlay">
  <div class="ov-icon">👑</div>
  <div class="ov-title">Puzzle solved!</div>
  <div class="ov-sub">All queens placed correctly.</div>
  <div class="ov-moves" id="ov-moves"></div>
  <button class="btn primary" style="width:180px;margin-top:6px" id="btn-ov-new">New Puzzle</button>
</div>

<script>
'use strict';

// ── Color palette ─────────────────────────────────────────────────────
const COLORS = [
  '#FFBDBD','#FFDBA8','#FEFDB5','#C6F7C6',
  '#AEE0FF','#D5B9FF','#FFB9E9','#A8EEE8',
  '#FFF1A8','#C9F1B0','#FFCFA8',
];

// ── Difficulty: grid size and Voronoi noise level ─────────────────────
// noise=0 → compact Voronoi blobs (easy to read)
// noise=5 → heavily randomised, snaking shapes (hard)
const DIFF = {
  easy:   { n: 6, noise: 0.4 },
  medium: { n: 7, noise: 2.0 },
  hard:   { n: 9, noise: 4.5 },
};

// ── Game state ────────────────────────────────────────────────────────
let N = 6;
let regions   = [];   // regions[cell] = 0..N-1
let solution  = [];   // solution[cell] = true at queen positions
let cellState = [];   // 0=blank  1=X-marker  2=queen
let conflicts = new Set();
let solved       = false;
let showingSol   = false;
let currentDiff  = 'easy';
let placementCount = 0;
let genId = 0;        // cancels stale async generation runs

// ── Utilities ─────────────────────────────────────────────────────────

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── Step 1: Place N queens (one per row, one per column) ──────────────
// Shuffles a column permutation and rejects any that have diagonally
// adjacent queens (|Δrow|=1 AND |Δcol|=1 between consecutive rows).
function placeQueens(n) {
  for (let attempt = 0; attempt < 500; attempt++) {
    const cols = shuffle([...Array(n).keys()]);
    let ok = true;
    for (let r = 0; r < n - 1; r++) {
      if (Math.abs(cols[r] - cols[r + 1]) === 1) { ok = false; break; }
    }
    if (ok) return cols;
  }
  return null; // extremely rare
}

// ── Step 2: Assign cells to regions (Voronoi with noise) ─────────────
// Each queen seeds its own region. Every other cell goes to the nearest
// queen by Manhattan distance, with Gaussian-like noise added to break
// ties and vary shape difficulty. Higher noise → more irregular regions.
function buildRegions(n, queenCols, noise) {
  const reg = new Array(n * n).fill(-1);

  // Seeds: queen positions are locked to their own region
  for (let row = 0; row < n; row++) reg[row * n + queenCols[row]] = row;

  // Assign remaining cells
  for (let c = 0; c < n * n; c++) {
    if (reg[c] !== -1) continue;
    const r = Math.floor(c / n), col = c % n;
    let best = Infinity, chosen = 0;
    for (let qi = 0; qi < n; qi++) {
      const dist = Math.abs(r - qi) + Math.abs(col - queenCols[qi])
                   + Math.random() * noise;
      if (dist < best) { best = dist; chosen = qi; }
    }
    reg[c] = chosen;
  }

  return reg;
}

// ── Step 3: Validate region shapes ───────────────────────────────────
// Reject any region confined to a single row or column. Such regions
// make the region constraint identical to row/column uniqueness, which
// produces many solutions (the "stripe bug").
function validateRegions(reg, n) {
  for (let ri = 0; ri < n; ri++) {
    let rowMin = n, rowMax = -1, colMin = n, colMax = -1;
    for (let c = 0; c < n * n; c++) {
      if (reg[c] !== ri) continue;
      const r = Math.floor(c / n), col = c % n;
      if (r   < rowMin) rowMin = r;
      if (r   > rowMax) rowMax = r;
      if (col < colMin) colMin = col;
      if (col > colMax) colMax = col;
    }
    if (rowMax - rowMin < 1 || colMax - colMin < 1) return false;
  }
  return true;
}

// ── Step 4: Uniqueness check (backtracking solver) ────────────────────
// Places queens row-by-row, enforcing one per column, one per region,
// and no diagonal adjacency between consecutive rows. Counts solutions;
// returns true iff exactly 1 exists. Node cap prevents runaway searches.
function isUnique(reg, n) {
  let count = 0;
  let nodes = 0;
  const placed   = new Array(n).fill(-1);
  const usedCols = new Set();
  const usedRegs = new Set();

  function bt(row) {
    if (count > 1 || nodes > 150000) return;
    if (row === n) { count++; return; }
    for (let col = 0; col < n; col++) {
      if (usedCols.has(col)) continue;
      if (usedRegs.has(reg[row * n + col])) continue;
      if (row > 0 && Math.abs(placed[row - 1] - col) === 1) continue;
      nodes++;
      placed[row] = col;
      usedCols.add(col);
      usedRegs.add(reg[row * n + col]);
      bt(row + 1);
      placed[row] = -1;
      usedCols.delete(col);
      usedRegs.delete(reg[row * n + col]);
    }
  }

  bt(0);
  return nodes <= 150000 && count === 1;
}

// ── Async generation ──────────────────────────────────────────────────
// Processes CHUNK attempts per tick so the UI never freezes.
// Returns a puzzle via onDone(result) or onDone(null) on failure.
function generateAsync(difficulty, myGenId, onDone) {
  const { n, noise } = DIFF[difficulty];
  const MAX   = 4000;
  const CHUNK = 40;
  let attempt = 0;

  function tick() {
    if (genId !== myGenId) return; // cancelled by a newer startNew()

    for (let i = 0; i < CHUNK; i++) {
      if (++attempt > MAX) { onDone(null); return; }

      const queenCols = placeQueens(n);
      if (!queenCols) continue;

      const reg = buildRegions(n, queenCols, noise);

      if (!validateRegions(reg, n)) continue;
      if (!isUnique(reg, n)) continue;

      const sol = new Array(n * n).fill(false);
      for (let row = 0; row < n; row++) sol[row * n + queenCols[row]] = true;

      onDone({ n, regions: reg, solution: sol });
      return;
    }

    setTimeout(tick, 0); // yield to browser, then continue
  }

  setTimeout(tick, 0);
}

// ── Conflict detection ────────────────────────────────────────────────
function detectConflicts() {
  const placed = [];
  for (let c = 0; c < N * N; c++) if (cellState[c] === 2) placed.push(c);

  const bad = new Set();
  const msgs = [];

  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      const ar = Math.floor(a / N), ac = a % N;
      const br = Math.floor(b / N), bc = b % N;

      function flag(msg) {
        bad.add(a); bad.add(b);
        if (!msgs.includes(msg)) msgs.push(msg);
      }

      if (ar === br)                                               flag('Two queens in the same row');
      if (ac === bc)                                               flag('Two queens in the same column');
      if (regions[a] === regions[b])                               flag('Two queens in the same region');
      if (Math.abs(ar-br) === 1 && Math.abs(ac-bc) === 1)         flag('Two queens are touching diagonally');
    }
  }

  return { bad, msgs };
}

function isSolved() {
  const placed = [];
  for (let c = 0; c < N * N; c++) if (cellState[c] === 2) placed.push(c);
  if (placed.length !== N || conflicts.size > 0) return false;
  const rows = new Set(), cols = new Set(), regs = new Set();
  for (const c of placed) {
    const r = Math.floor(c / N), col = c % N;
    if (rows.has(r) || cols.has(col) || regs.has(regions[c])) return false;
    rows.add(r); cols.add(col); regs.add(regions[c]);
  }
  return true;
}

// ── Rendering ─────────────────────────────────────────────────────────
function renderBoard() {
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  el.innerHTML = '';

  const THICK = '2px solid rgba(25,25,25,0.48)';
  const THIN  = '1px solid rgba(0,0,0,0.09)';

  for (let c = 0; c < N * N; c++) {
    const row = Math.floor(c / N), col = c % N, ri = regions[c];

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.cell = String(c);
    cell.style.background = COLORS[ri % COLORS.length];

    // Thick border where region changes; thin border within same region
    cell.style.borderTop    = (row === 0     || regions[c - N] !== ri) ? THICK : THIN;
    cell.style.borderLeft   = (col === 0     || regions[c - 1] !== ri) ? THICK : THIN;
    cell.style.borderRight  = (col === N - 1 || regions[c + 1] !== ri) ? THICK : THIN;
    cell.style.borderBottom = (row === N - 1 || regions[c + N] !== ri) ? THICK : THIN;

    const state = cellState[c];
    if (state > 0) {
      const mark = document.createElement('div');
      if (state === 1) {
        mark.className = 'mark mark-x';
        mark.textContent = '✕';
      } else {
        mark.className = 'mark ' + (
          solved             ? 'mark-solved'   :
          conflicts.has(c)   ? 'mark-conflict' :
                               'mark-queen'
        );
        mark.textContent = '♛';
      }
      cell.appendChild(mark);
    }

    el.appendChild(cell);
  }
}

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  for (let ri = 0; ri < N; ri++) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const sw = document.createElement('div');
    sw.className = 'legend-swatch';
    sw.style.background = COLORS[ri % COLORS.length];
    item.appendChild(sw);
    item.appendChild(document.createTextNode('Region ' + (ri + 1)));
    el.appendChild(item);
  }
}

function updateStatus(msgs = []) {
  const msgEl   = document.getElementById('status-msg');
  const countEl = document.getElementById('status-count');
  const placed  = cellState.filter(v => v === 2).length;

  countEl.textContent = placed > 0 ? `${placed} / ${N}` : '';

  if (solved) {
    msgEl.className = 'status-msg solved';
    msgEl.textContent = '✓ Puzzle solved!';
    countEl.textContent = '';
    return;
  }
  if (showingSol) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'This is the unique solution';
    countEl.textContent = '';
    return;
  }
  if (msgs.length > 0) {
    msgEl.className = 'status-msg conflict';
    msgEl.textContent = msgs[0];
  } else if (placed === 0) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'Tap a cell to begin';
  } else if (placed === N) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'Almost — check your placement';
  } else {
    msgEl.className = 'status-msg';
    msgEl.textContent = `${placed} of ${N} queens placed`;
  }
}

// ── Interaction ───────────────────────────────────────────────────────
document.getElementById('board').addEventListener('click', e => {
  if (solved || showingSol) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const c = parseInt(cell.dataset.cell, 10);

  // Cycle: blank (0) → X mark (1) → queen (2) → blank (0)
  cellState[c] = (cellState[c] + 1) % 3;
  if (cellState[c] === 2) placementCount++;

  const { bad, msgs } = detectConflicts();
  conflicts = bad;

  const queenCount = cellState.filter(v => v === 2).length;
  if (queenCount === N && conflicts.size === 0 && isSolved()) {
    solved = true;
    conflicts = new Set();
    renderBoard();
    updateStatus();
    setTimeout(() => {
      document.getElementById('ov-moves').textContent =
        `${placementCount} placement${placementCount !== 1 ? 's' : ''}`;
      document.getElementById('overlay').classList.add('show');
      try { window.parent.postMessage({ type: 'queens-solved', difficulty: currentDiff }, '*'); } catch {}
    }, 380);
  } else {
    renderBoard();
    updateStatus(msgs);
  }
});

document.getElementById('btn-solution').addEventListener('click', () => {
  if (showingSol) {
    showingSol = false;
    document.getElementById('btn-solution').textContent = 'Show Solution';
    renderBoard();
    updateStatus();
    return;
  }
  showingSol = true;
  document.getElementById('btn-solution').textContent = 'Hide Solution';
  // Render solution without mutating player state
  const saved = [...cellState];
  const wasSolved = solved;
  cellState = solution.map(v => v ? 2 : 0);
  solved = true; conflicts = new Set();
  renderBoard();
  solved = wasSolved; cellState = saved;
  updateStatus();
});

function startNew() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('btn-solution').textContent = 'Show Solution';
  showingSol = false;
  solved = false;
  conflicts = new Set();
  placementCount = 0;

  const myId = ++genId; // invalidates any in-progress generation
  N = DIFF[currentDiff].n;

  document.getElementById('board').innerHTML =
    `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:13px;padding:32px">Generating…</div>`;
  const msgEl = document.getElementById('status-msg');
  msgEl.className = 'status-msg';
  msgEl.textContent = 'Generating puzzle…';
  document.getElementById('status-count').textContent = '';

  generateAsync(currentDiff, myId, result => {
    if (genId !== myId) return; // another startNew fired while we were computing
    if (!result) {
      msgEl.textContent = 'Tap "New Puzzle" to try again';
      return;
    }
    N        = result.n;
    regions  = result.regions;
    solution = result.solution;
    cellState = new Array(N * N).fill(0);
    renderBoard();
    renderLegend();
    updateStatus();
  });
}

document.getElementById('btn-new').addEventListener('click', startNew);
document.getElementById('btn-ov-new').addEventListener('click', startNew);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.diff === currentDiff) return;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
    startNew();
  });
});

startNew();
</script>
</body>
</html>
