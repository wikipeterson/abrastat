<!-- wand: stick goes from lower-left to upper-right, gold tip is just the last segment of the line in gold -->
<g style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
  <!-- dark shaft -->
  <line x1="148" y1="108" x2="194" y2="38" stroke="#1A8C80" stroke-width="4" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(26, 140, 128);color:rgb(0, 0, 0);stroke-width:4px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- gold tip — a short gold segment at the top end of the wand, same angle, overlapping the end -->
  <line x1="186" y1="50" x2="197" y2="33" stroke="#F5A623" stroke-width="5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(245, 166, 35);color:rgb(0, 0, 0);stroke-width:5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</g>

<!-- arc of stars from tip (197,33) curving over toward Stat — tight spacing early, spreading wide -->
