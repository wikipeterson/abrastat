<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Queens — Puzzle Week</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #E8FAF8;
  --text: #0D4F49;
  --muted: #1A8C80;
  --accent: #2EC4B6;
  --accent-light: #D6F5F2;
  --border: #7FD9D3;
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  padding: 10px 14px;
  gap: 7px;
}

/* ── Title / difficulty ── */
.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.game-title { font-size: 18px; font-weight: 700; }
.diff-group { display: flex; gap: 4px; }
.diff-btn {
  font-size: 11px; font-weight: 600;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: white; color: var(--muted);
  cursor: pointer; transition: all 0.14s;
}
.diff-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

/* ── Status bar ── */
.status-bar {
  flex-shrink: 0;
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 14px;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 34px;
}
#status-msg { font-weight: 600; }
#status-msg.conflict { color: #B22222; }
#status-msg.solved   { color: #1A7A4A; }
#status-count { color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }

/* ── Board ── */
.board-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#board {
  display: grid;
  /* Size: the smaller of viewport width (minus padding) or remaining height */
  width: min(calc(100vw - 28px), calc(100dvh - 198px));
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  user-select: none;
  touch-action: none;
  cursor: pointer;
}
.cell {
  position: relative;
  transition: filter 0.08s;
}
.cell:active { filter: brightness(0.85); }

/* Marks sit absolutely so they never affect cell dimensions */
.mark {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(10px, 3.4vw, 22px);
  pointer-events: none;
  line-height: 1;
}
.mark-x        { color: rgba(0,0,0,0.28); font-weight: 700; font-size: clamp(9px, 2.8vw, 18px); }
.mark-queen    { color: rgba(0,0,0,0.70); text-shadow: 0 1px 3px rgba(0,0,0,0.18); }
.mark-conflict { color: #B22222; text-shadow: 0 0 6px rgba(178,34,34,0.35); }
.mark-solved   { color: #1A7A4A; text-shadow: 0 0 8px rgba(46,196,182,0.55); animation: pop 0.28s ease; }
@keyframes pop { 0%{transform:scale(0.25)} 65%{transform:scale(1.18)} 100%{transform:scale(1)} }

/* ── Buttons ── */
.btn-row { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
  flex: 1; font-size: 13px; font-weight: 600;
  padding: 9px 0; border-radius: 12px;
  border: 1.5px solid var(--border);
  background: white; color: var(--text);
  cursor: pointer; transition: background 0.14s;
}
.btn:hover { background: var(--accent-light); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { filter: brightness(1.06); }

/* ── Legend ── */
.legend {
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; gap: 3px 10px;
  max-height: 44px; overflow: hidden;
  font-size: 11px; color: var(--muted);
  padding: 0 2px;
}
.legend-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.legend-swatch {
  width: 10px; height: 10px; border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.18); flex-shrink: 0;
}

/* ── Success overlay ── */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(232,250,248,0.94); z-index: 50;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 24px;
}
#overlay.show { display: flex; }
.ov-icon { font-size: 52px; animation: bounce 0.45s ease; }
@keyframes bounce { 0%{transform:scale(0)} 55%{transform:scale(1.22)} 100%{transform:scale(1)} }
.ov-title { font-size: 26px; font-weight: 800; }
.ov-sub   { color: var(--muted); font-size: 14px; }
.ov-moves { font-weight: 700; color: var(--accent); font-size: 15px; }
</style>
</head>
<body>
<div id="app">

  <div class="title-row">
    <span class="game-title">👑 Queens</span>
    <div class="diff-group">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn"        data-diff="medium">Medium</button>
      <button class="diff-btn"        data-diff="hard">Hard</button>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-msg">Tap a cell to begin</span>
    <span id="status-count"></span>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="btn-row">
    <button class="btn"         id="btn-solution">Show Solution</button>
    <button class="btn primary" id="btn-new">New Puzzle</button>
  </div>

  <div class="legend" id="legend"></div>

</div>

<div id="overlay">
  <div class="ov-icon">👑</div>
  <div class="ov-title">Puzzle solved!</div>
  <div class="ov-sub">All queens placed correctly.</div>
  <div class="ov-moves" id="ov-moves"></div>
  <button class="btn primary" style="width:180px;margin-top:6px" id="btn-ov-new">New Puzzle</button>
</div>

<script>
'use strict';

// ── Region color palette (11 accessible pastels) ──────────────────────
const COLORS = [
  '#FFBDBD','#FFDBA8','#FEFDB5','#C6F7C6',
  '#AEE0FF','#D5B9FF','#FFB9E9','#A8EEE8',
  '#FFF1A8','#C9F1B0','#FFCFA8',
];

// ── Difficulty ────────────────────────────────────────────────────────
const DIFF = { easy: { n: 6 }, medium: { n: 7 }, hard: { n: 9 } };

// ── Game state ────────────────────────────────────────────────────────
let N = 6;
let regions   = [];   // regions[cell] = region index 0..N-1
let solution  = [];   // solution[cell] = true if queen belongs here
let cellState = [];   // 0 = blank, 1 = X marker, 2 = queen
let conflicts = new Set();
let solved    = false;
let showingSol = false;
let currentDiff = 'easy';
let placementCount = 0;

// ── Utilities ─────────────────────────────────────────────────────────

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Orthogonal (4-connected) neighbors of cell c in an n×n grid
function nbrs4(c, n) {
  const r = Math.floor(c / n), col = c % n, out = [];
  if (r > 0)     out.push(c - n);
  if (r < n - 1) out.push(c + n);
  if (col > 0)   out.push(c - 1);
  if (col < n-1) out.push(c + 1);
  return out;
}

// ── Step 1-2: Random queen placement ─────────────────────────────────
// One queen per row and column (permutation), no diagonal adjacency
// between any two queens (|Δrow|=1 and |Δcol|=1 is forbidden).
function placeQueens(n) {
  for (let attempt = 0; attempt < 400; attempt++) {
    const cols = shuffle([...Array(n).keys()]);
    let ok = true;
    // Only consecutive rows can be diagonally adjacent (|Δrow|=1 requires Δrow=±1)
    for (let r = 0; r < n - 1; r++) {
      if (Math.abs(cols[r] - cols[r + 1]) === 1) { ok = false; break; }
    }
    if (ok) return cols;
  }
  return null;
}

// ── Step 3-4: Flood-fill regions from queen seeds ────────────────────
// Each queen seeds its own region; cells expand BFS-style.
// Easy:   FIFO frontier + greedy (join region with most neighbors → blobs)
// Medium: random frontier + greedy (irregular shapes)
// Hard:   random frontier + random region (snaking, interleaved shapes)
function floodFill(n, queenCols, difficulty) {
  const total = n * n;
  const reg = new Array(total).fill(-1);

  // Plant seeds at queen positions
  for (let row = 0; row < n; row++) reg[row * n + queenCols[row]] = row;

  // Initial frontier: all unassigned cells adjacent to a seed
  const inQ = new Array(total).fill(false);
  const queue = [];
  for (let c = 0; c < total; c++) {
    if (reg[c] !== -1) {
      for (const nb of nbrs4(c, n)) {
        if (reg[nb] === -1 && !inQ[nb]) { queue.push(nb); inQ[nb] = true; }
      }
    }
  }

  while (queue.length > 0) {
    // Cell selection strategy
    const idx = (difficulty === 'easy') ? 0 : Math.floor(Math.random() * queue.length);
    const c = queue.splice(idx, 1)[0];
    inQ[c] = false;

    const assignedNbrs = nbrs4(c, n).filter(nb => reg[nb] !== -1);
    if (assignedNbrs.length === 0) continue;

    let chosen;
    if (difficulty === 'hard') {
      // Random: any neighboring region
      chosen = reg[assignedNbrs[Math.floor(Math.random() * assignedNbrs.length)]];
    } else {
      // Greedy: join region with most adjacent already-assigned cells
      const cnt = {};
      for (const nb of assignedNbrs) cnt[reg[nb]] = (cnt[reg[nb]] || 0) + 1;
      chosen = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0];
    }

    reg[c] = chosen;

    for (const nb of nbrs4(c, n)) {
      if (reg[nb] === -1 && !inQ[nb]) { queue.push(nb); inQ[nb] = true; }
    }
  }

  return reg.includes(-1) ? null : reg;
}

// ── Step 5: Region shape validation ──────────────────────────────────
// Reject grids where any region is confined to a single row or column.
// Such regions make the region constraint identical to row/column constraint
// and produce hundreds of solutions (the "stripe bug").
// Every region must span at least 2 rows AND at least 2 columns.
function validateRegions(reg, n) {
  for (let ri = 0; ri < n; ri++) {
    let rowMin = n, rowMax = -1, colMin = n, colMax = -1;
    for (let c = 0; c < n * n; c++) {
      if (reg[c] !== ri) continue;
      const r = Math.floor(c / n), col = c % n;
      if (r   < rowMin) rowMin = r;
      if (r   > rowMax) rowMax = r;
      if (col < colMin) colMin = col;
      if (col > colMax) colMax = col;
    }
    // Must span at least 2 rows AND 2 columns
    if (rowMax - rowMin < 1 || colMax - colMin < 1) return false;
  }
  return true;
}

// ── Step 6: Uniqueness check (backtracking) ───────────────────────────
// Count all valid solutions. Return true iff exactly 1 exists.
// Places queens row by row; checks column, region, and diagonal-adjacency.
function isUnique(reg, n) {
  let count = 0;
  const placed    = new Array(n).fill(-1);
  const usedCols  = new Set();
  const usedRegs  = new Set();

  function bt(row) {
    if (count > 1) return; // early exit once we know it's non-unique
    if (row === n) { count++; return; }

    for (let col = 0; col < n; col++) {
      if (usedCols.has(col)) continue;
      if (usedRegs.has(reg[row * n + col])) continue;
      // No diagonal adjacency with the queen placed in the immediately preceding row
      if (row > 0 && Math.abs(placed[row - 1] - col) === 1) continue;

      placed[row] = col;
      usedCols.add(col);
      usedRegs.add(reg[row * n + col]);
      bt(row + 1);
      placed[row] = -1;
      usedCols.delete(col);
      usedRegs.delete(reg[row * n + col]);
    }
  }

  bt(0);
  return count === 1;
}

// ── Main generation entry point ───────────────────────────────────────
function generate(difficulty) {
  const n = DIFF[difficulty].n;

  for (let attempt = 0; attempt < 700; attempt++) {
    const queenCols = placeQueens(n);
    if (!queenCols) continue;

    const reg = floodFill(n, queenCols, difficulty);
    if (!reg) continue;

    // Reject stripe-pattern grids (step 5)
    if (!validateRegions(reg, n)) continue;

    // Reject puzzles with multiple solutions (step 6)
    if (!isUnique(reg, n)) continue;

    const sol = new Array(n * n).fill(false);
    for (let row = 0; row < n; row++) sol[row * n + queenCols[row]] = true;

    return { n, regions: reg, solution: sol };
  }
  return null;
}

// ── Conflict detection ────────────────────────────────────────────────
// Returns the set of conflicting queen cells and specific error messages.
function detectConflicts() {
  const placed = [];
  for (let c = 0; c < N * N; c++) if (cellState[c] === 2) placed.push(c);

  const bad  = new Set();
  const msgs = [];

  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const a = placed[i], b = placed[j];
      const ar = Math.floor(a / N), ac = a % N;
      const br = Math.floor(b / N), bc = b % N;

      if (ar === br) {
        bad.add(a); bad.add(b);
        if (!msgs.includes('Two queens in the same row')) msgs.push('Two queens in the same row');
      }
      if (ac === bc) {
        bad.add(a); bad.add(b);
        if (!msgs.includes('Two queens in the same column')) msgs.push('Two queens in the same column');
      }
      if (regions[a] === regions[b]) {
        bad.add(a); bad.add(b);
        if (!msgs.includes('Two queens in the same region')) msgs.push('Two queens in the same region');
      }
      if (Math.abs(ar - br) === 1 && Math.abs(ac - bc) === 1) {
        bad.add(a); bad.add(b);
        if (!msgs.includes('Two queens are touching diagonally')) msgs.push('Two queens are touching diagonally');
      }
    }
  }

  return { bad, msgs };
}

function isSolved() {
  const placed = [];
  for (let c = 0; c < N * N; c++) if (cellState[c] === 2) placed.push(c);
  if (placed.length !== N || conflicts.size > 0) return false;
  const rows = new Set(), cols = new Set(), regs = new Set();
  for (const c of placed) {
    const r = Math.floor(c / N), col = c % N;
    if (rows.has(r) || cols.has(col) || regs.has(regions[c])) return false;
    rows.add(r); cols.add(col); regs.add(regions[c]);
  }
  return true;
}

// ── Rendering ─────────────────────────────────────────────────────────
function renderBoard() {
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  el.innerHTML = '';

  // Border styles: thick at region boundaries, thin within a region
  const THICK = '2px solid rgba(25,25,25,0.48)';
  const THIN  = '1px solid rgba(0,0,0,0.09)';

  for (let c = 0; c < N * N; c++) {
    const row = Math.floor(c / N), col = c % N;
    const ri = regions[c];

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.cell = String(c);
    cell.style.background = COLORS[ri % COLORS.length];

    // Draw thick borders between different regions; thin borders within
    cell.style.borderTop    = (row === 0     || regions[c - N] !== ri) ? THICK : THIN;
    cell.style.borderLeft   = (col === 0     || regions[c - 1] !== ri) ? THICK : THIN;
    cell.style.borderRight  = (col === N - 1 || regions[c + 1] !== ri) ? THICK : THIN;
    cell.style.borderBottom = (row === N - 1 || regions[c + N] !== ri) ? THICK : THIN;

    // Overlay mark (never affects cell dimensions — absolutely positioned)
    const state = cellState[c];
    if (state > 0) {
      const mark = document.createElement('div');
      if (state === 1) {
        mark.className = 'mark mark-x';
        mark.textContent = '✕';
      } else {
        const inConflict = conflicts.has(c);
        mark.className = 'mark ' + (
          solved       ? 'mark-solved'   :
          inConflict   ? 'mark-conflict' :
                         'mark-queen'
        );
        mark.textContent = '♛';
      }
      cell.appendChild(mark);
    }

    el.appendChild(cell);
  }
}

function renderLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = '';
  for (let ri = 0; ri < N; ri++) {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const swatch = document.createElement('div');
    swatch.className = 'legend-swatch';
    swatch.style.background = COLORS[ri % COLORS.length];
    item.appendChild(swatch);
    item.appendChild(document.createTextNode('Region ' + (ri + 1)));
    el.appendChild(item);
  }
}

function updateStatus(conflictMsgs = []) {
  const msgEl   = document.getElementById('status-msg');
  const countEl = document.getElementById('status-count');
  const placed  = cellState.filter(v => v === 2).length;

  countEl.textContent = placed > 0 ? `${placed} / ${N}` : '';

  if (solved) {
    msgEl.className = 'status-msg solved';
    msgEl.textContent = '✓ Puzzle solved!';
    countEl.textContent = '';
    return;
  }
  if (showingSol) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'This is the unique solution';
    countEl.textContent = '';
    return;
  }
  if (conflictMsgs.length > 0) {
    msgEl.className = 'status-msg conflict';
    msgEl.textContent = conflictMsgs[0];
  } else if (placed === 0) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'Tap a cell to begin';
  } else if (placed === N) {
    msgEl.className = 'status-msg';
    msgEl.textContent = 'Almost — check your placement';
  } else {
    msgEl.className = 'status-msg';
    msgEl.textContent = `${placed} of ${N} queens placed`;
  }
}

// ── Interaction ───────────────────────────────────────────────────────
document.getElementById('board').addEventListener('click', e => {
  if (solved || showingSol) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const c = parseInt(cell.dataset.cell, 10);

  // Cycle: blank (0) → X mark (1) → queen (2) → blank (0)
  cellState[c] = (cellState[c] + 1) % 3;
  if (cellState[c] === 2) placementCount++;

  const { bad, msgs } = detectConflicts();
  conflicts = bad;

  if (cellState.filter(v => v === 2).length === N && conflicts.size === 0 && isSolved()) {
    solved = true;
    conflicts = new Set();
    renderBoard();
    updateStatus();
    setTimeout(() => {
      document.getElementById('ov-moves').textContent =
        `${placementCount} placement${placementCount !== 1 ? 's' : ''}`;
      document.getElementById('overlay').classList.add('show');
      try { window.parent.postMessage({ type: 'queens-solved', difficulty: currentDiff }, '*'); } catch {}
    }, 380);
  } else {
    renderBoard();
    updateStatus(msgs);
  }
});

document.getElementById('btn-solution').addEventListener('click', () => {
  if (showingSol) {
    showingSol = false;
    document.getElementById('btn-solution').textContent = 'Show Solution';
    renderBoard();
    updateStatus();
    return;
  }
  showingSol = true;
  document.getElementById('btn-solution').textContent = 'Hide Solution';
  // Temporarily render solution state (do not mutate saved state)
  const savedState = [...cellState];
  const savedSolved = solved;
  cellState = solution.map(v => v ? 2 : 0);
  solved = true;
  conflicts = new Set();
  renderBoard();
  solved = savedSolved;
  cellState = savedState;
  updateStatus();
});

function startNew() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('btn-solution').textContent = 'Show Solution';
  showingSol = false;
  solved = false;
  conflicts = new Set();
  placementCount = 0;

  N = DIFF[currentDiff].n;

  // Show spinner while generating (generation can take a moment for n=9)
  document.getElementById('board').innerHTML =
    `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;
      color:var(--muted);font-size:13px;padding:32px">Generating puzzle…</div>`;
  document.getElementById('status-msg').textContent = 'Generating…';
  document.getElementById('status-msg').className = 'status-msg';
  document.getElementById('status-count').textContent = '';

  setTimeout(() => {
    const result = generate(currentDiff);
    if (!result) {
      document.getElementById('status-msg').textContent = 'Generation failed — tap New Puzzle to retry';
      return;
    }

    N        = result.n;
    regions  = result.regions;
    solution = result.solution;
    cellState = new Array(N * N).fill(0);

    renderBoard();
    renderLegend();
    updateStatus();
  }, 25);
}

document.getElementById('btn-new').addEventListener('click', startNew);
document.getElementById('btn-ov-new').addEventListener('click', startNew);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.diff === currentDiff) return;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.dataset.diff;
    startNew();
  });
});

// ── Init ──────────────────────────────────────────────────────────────
startNew();
</script>
</body>
</html>
